---
deployment:
  tasks:
    # 1. Tự động nhận diện thư mục public_html bằng biến $HOME (Không cần sửa username)
    - export DEPLOYPATH=$HOME/public_html/
    
    # 2. Tự động đồng bộ các thư mục mã nguồn sang website
    - /bin/cp -R backend $DEPLOYPATH
    - /bin/cp -R frontend $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp package-lock.json $DEPLOYPATH
    - /bin/cp .env $DEPLOYPATH 2>/dev/null || :
    
    # 3. Tự động khởi động lại Node.js backend
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
