name: Tự Động Đồng Bộ cPanel (Auto Deploy to cPanel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dong-bo-ftp:
    name: Tự động tải code lên cPanel qua FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Lấy mã nguồn mới nhất từ GitHub
        uses: actions/checkout@v4

      - name: 📂 Đồng bộ toàn bộ tệp lên cPanel qua FTP (Nếu đã cấu hình Secrets)
        if: "${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' }}"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cap_nhat_website.zip
            test-results/**
            playwright-report/**

      - name: 🔄 Kích hoạt tự động đồng bộ & khởi động lại Node.js
        run: |
          echo "🚀 Gửi tín hiệu tự động đồng bộ sang cPanel..."
          curl -s -X POST "https://tainguyenpremium.store/api/tu-dong-dong-bo" --max-time 30 || true
